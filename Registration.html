<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h2>User Registration</h2>
    <table>
        <tbody>
            <tr>
                <td><label>Email ID</label></td>
                <td><input type="email" placeholder="Enter Email ID"></td>
            </tr>
            <tr>
                <td><label>Password</label></td>
                <td><input type="password" placeholder="Enter Password"></td>
            </tr>
            <tr>
                <td><label>Confirm Password</label></td>
                <td><input type="password" placeholder="Enter Password again"></td>
            </tr>
            <tr>
                <td><lab>Full Name</lab></td>
                <td><input type="text" placeholder="Enter Full Name"></td>
            </tr>
            <tr>
                <td><label>Phone No</label></td>
                <td><input type="tel" placeholder="Enter phone number"></td>
            </tr>
            <tr align="center">
                <td colspan="2"><button type="submit">Signup</button></td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
